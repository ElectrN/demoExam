<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал "Корочки.есть"</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Портал "Корочки.есть"</h1>
    <p class="lead">Запись на курсы дополнительного профессионального образования</p>
</header>
<main class="container mt-4">
    <div id="courseCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://placehold.co/800x600?text=Hello+World" class="d-block w-100 rounded img-thumbnail" alt="Hello world">
            </div>
            <div class="carousel-item">
                <img src="https://placehold.co/800x600?text=Kseniya\nis+here" class="d-block w-100 rounded img-thumbnail" alt="Hello world">
            </div>
            <div class="carousel-item">
                <img src="https://placehold.co/800x600?text=IamNotAlone" class="d-block w-100 rounded img-thumbnail" alt="Hello world">
            </div>
            <div class="carousel-item">
                <img src="https://placehold.co/800x600" class="d-block w-100 rounded img-thumbnail" alt="Hello world">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#courseCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Назад</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#courseCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Вперёд</span>
        </button>
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="0" aria-label="СЛайд 1" class="active" aria-current="true"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="1" aria-label="СЛайд 2"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="2" aria-label="СЛайд 3"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="3" aria-label="СЛайд 4"></button>
        </div>
    </div>

    <div class="btn-group-home mt-4" >
        <a href="register.html" class="btn btn-primary btn-lg">Регстрация</a>
        <a href="login.html" class="btn btn-success btn-lg">Вход</a>
    </div>
</main>
<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Авторские права защищены!</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const carousel = document.getElementById("courseCarousel")
    const bootstapCarousel = new bootstrap.Carousel(carousel, {
        wrap: true,
        interval: 3000
    })
</script>
</body>
</html>
