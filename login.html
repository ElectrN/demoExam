<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Корочки.есть</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Портал "Корочки.есть"</h1>
    <p class="lead">Вход в личный кабинет</p>
</header>
<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="login" placeholder="Login" required>
                    <label for="login">Логин</label>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>
            <div id="message" class="mt-3"></div>
            <p class="mt-3 mb-0 text-center">
                Нет аккаунта? <a href="register.html">Регистрация</a>
            </p>
        </div>
    </div>
</main>
<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Авторские права защищены!</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const login = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value;

        const msgEl = document.getElementById("message");

        if (!login || !password) {
            msgEl.className = 'alert-error'
            msgEl.textContent="Введите логин и пароль!"
            return;
        }

        msgEl.className = 'alert-success'
        msgEl.textContent = 'Данные отправлены на сервер'
    });
</script>
</body>
</html>
