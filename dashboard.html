<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Корочки.есть</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Личный кабинет</h1>
    <p id=welcomeMessage" class="lead">Загрузка...</p>
</header>
<main class="container mt-4">
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">Подать заявку на курс</h2>
        </div>
        <div class="card-body">
            <form id="applicationForm">
                <div class="mb-3">
                    <label for="course" class="form-label">Название курса</label>
                    <select class="form-control" id="course" required>
                        <option value="">Выберите курс</option>
                        <option value="Основы алгоритмизации и программирования">
                            Основы алгоритмизации и программирования
                        </option>
                        <option value="Основы веб-дизайна">
                            Основы веб-дизайна
                        </option>
                        <option value="Основы проектирования баз данных">
                            Основы проектирования баз данны
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Желаемая дата начала</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="mb-3">
                    <label for="payment" class="form-label">Способ оплаты</label>
                    <select class="form-control" id="payment" required>
                        <option value="Наличными">Наличными</option>
                        <option value="Перевод по СБП">Перевод по СБП</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить заявку</button>
            </form>
            <div id="message" class="mt-2"></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">Мои заявки</h2>
        </div>
        <div class="card-body">
            <div id="applicationsList">
                <p>Загрузка заявок...</p>
            </div>
        </div>
    </div>
    <a href="index.html" class="btn btn-danger w-100 mt-4">Выйти</a>
</main>
<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Авторские права защищены!</p>
</footer>
</body>
</html>
