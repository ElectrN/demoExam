<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал "Корочки.есть"</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Портал "Корочки.есть"</h1>
    <p class="lead">Запись на курсы дополнительного профессионального образования</p>
</header>

<main class="container mt-4">
    <!-- Карусель изображений (Bootstrap Carousel) -->
    <div id="courseCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../assets/images/image-1.jpg" class="d-block w-100" alt="Слайд 1">
            </div>
            <div class="carousel-item">
                <img src="../assets/images/image-2.jpg" class="d-block w-100" alt="Слайд 2">
            </div>
            <div class="carousel-item">
                <img src="../assets/images/image-3.jpg" class="d-block w-100" alt="Слайд 3">
            </div>
            <div class="carousel-item">
                <img src="../assets/images/image-4.jpg" class="d-block w-100" alt="Слайд 4">
            </div>
        </div>
        <!-- Кнопки навигации -->
        <button class="carousel-control-prev" type="button" data-bs-target="#courseCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Назад</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#courseCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Вперёд</span>
        </button>
        <!-- Индикаторы (точки) -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="0" class="active" aria-current="true"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#courseCarousel" data-bs-slide-to="3"></button>
        </div>
    </div>

    <!-- Кнопки навигации -->
    <div class="hero-text">
        <div class="btn-group-home">
            <a href="register.html" class="btn btn-primary btn-lg">Регистрация</a>
            <a href="login.html" class="btn btn-success btn-lg">Вход</a>
        </div>
    </div>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Портал «Корочки.есть»</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Настройка автосмены слайдов каждые 3 секунды
    const carousel = document.getElementById('courseCarousel');
    const bsCarousel = new bootstrap.Carousel(carousel, {
        interval: 3000,
        wrap: true
    });
</script>
</body>
</html>
