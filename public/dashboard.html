<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Корочки.есть</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Личный кабинет</h1>
    <p id="welcomeMessage" class="lead">Загрузка...</p>
</header>

<main class="container mt-4">
    <!-- Форма подачи заявки -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">Подать заявку на курс</h2>
        </div>
        <div class="card-body">
            <form id="applicationForm">
                <div class="mb-3">
                    <label for="course" class="form-label">Название курса</label>
                    <select id="course" class="form-control" required>
                        <option value="">Выберите курс</option>
                        <option value="Основы алгоритмизации и программирования">Основы алгоритмизации и программирования</option>
                        <option value="Основы веб-дизайна">Основы веб-дизайна</option>
                        <option value="Основы проектирования баз данных">Основы проектирования баз данных</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Желаемая дата начала</label>
                    <input type="date" id="startDate" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="payment" class="form-label">Способ оплаты</label>
                    <select id="payment" class="form-control" required>
                        <option value="">Выберите способ</option>
                        <option value="Наличными">Наличными</option>
                        <option value="Перевод по номеру телефона">Перевод по номеру телефона</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить заявку</button>
            </form>
            <div id="appMessage" class="mt-2"></div>
        </div>
    </div>

    <!-- Список заявок -->
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="h5 mb-0">Мои заявки</h2>
        </div>
        <div class="card-body">
            <div id="applicationsList">
                <p>Загрузка заявок...</p>
            </div>
        </div>
    </div>

    <!-- Кнопка выхода -->
    <button id="logoutBtn" class="btn btn-secondary w-100 mt-4">Выйти</button>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Портал «Корочки.есть»</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
