<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Корочки.есть</title>
    <!-- Bootstrap CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Локальные стили (путь из public/ в assets/) -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<!-- Шапка сайта -->
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Портал "Корочки.есть"</h1>
    <p class="lead">Регистрация нового пользователя</p>
</header>

<!-- Основной контент -->
<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <!-- Форма регистрации -->
            <form id="registerForm">
                <div class="mb-3">
                    <label for="login" class="form-label">Логин (латиница, ≥6 символов)</label>
                    <input type="text" class="form-control" id="login" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль (≥8 символов)</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="fio" class="form-label">ФИО (кириллица)</label>
                    <input type="text" class="form-control" id="fio" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон (8(XXX)XXX-XX-XX)</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <!-- Контейнер для сообщений -->
            <div id="message" class="mt-3"></div>
            <!-- Ссылка на вход -->
            <p class="text-center mt-3 mb-0">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
</main>

<!-- Подвал сайта -->
<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Портал «Корочки.есть»</p>
</footer>

<!-- Bootstrap JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Единый скрипт проекта (путь из public/ в assets/) -->
<script src="../assets/js/app.js"></script>
</body>
</html>
