<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Корочки.есть</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="bg-dark text-white text-center py-4">
    <h1 class="display-2">Панель администратора</h1>
    <p class="lead">Управление заявками пользователей</p>
</header>

<main class="container mt-4">
    <!-- Фильтр + Кнопка обновления + Выход -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <label class="form-label mb-0">Фильтр:</label>
        <select id="statusFilter" class="form-select form-select-sm" style="width: auto;">
            <option value="all">Все заявки</option>
            <option value="Новая">Новая</option>
            <option value="Идет обучение">Идет обучение</option>
            <option value="Обучение завершено">Обучение завершено</option>
        </select>
    </div>
    <div class="d-flex gap-2">
        <button id="refreshBtn" class="btn btn-outline-light btn-sm">Обновить</button>
        <button id="adminLogoutBtn" class="btn btn-danger btn-sm">Выйти</button>
    </div>
    </div>

    <!-- Контейнер для списка заявок -->
    <div id="allApplications">
        <p>Загрузка заявок...</p>
    </div>

    <!-- Контейнер для ошибок -->
    <div id="errorMessage" class="mt-3" style="display:none;"></div>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Портал «Корочки.есть»</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
