<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Корочки.есть</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-primary text-white text-center py-4">
    <h1 class="display-2">Портал "Корочки.есть"</h1>
    <p class="lead">Регистрация нового пользователя</p>
</header>
<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <form id="registerForm">
                <div class="mb-3">
                    <label for="login" class="form-label">Логин (латиница, ≥6 символов)</label>
                    <input type="text" class="form-control" id="login" >
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль (≥8 символов)</label>
                    <input type="password" class="form-control" id="password" >
                </div>
                <div class="mb-3">
                    <label for="fio" class="form-label">ФИО (кириллица)</label>
                    <input type="text" class="form-control" id="fio" >
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон (8(XXX)XXX-XX-XX)</label>
                    <input type="tel" class="form-control" id="phone" >
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" >
                </div>
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <div id="message" class="mt-3"></div>
            <p class="text-center mt-3 mb-0">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 Портал «Корочки.есть»</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("registerForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const login = document.getElementById("login").value;
        const password = document.getElementById("password").value;
        const fio = document.getElementById("fio").value;
        const phone = document.getElementById("phone").value;
        const email = document.getElementById("email").value;

        let errors = [];

        if (login.length <6 || !/^[a-zA-Z0-9]+$/.test(login)) {
            errors.push('Логин:латиница и цифры, минимум 6 символов')
        }
        if (password.length < 8) {
            errors.push("Пароль: минимум 8 символов")
        }
        if(!/^[а-яА-Я\s]+$/.test(fio)) {
            errors.push("ФИО: только кириллица и пробелы")
        }
        if(!/^8\(\d{3}\)\d{3}-\d{2}-\d{2}$/.test(phone)) {
            errors.push("Телефон: формат 8(ХХХ)ХХХ-ХХ-ХХ")
        }

        const msgEl = document.getElementById("message")
        if(errors.length > 0){
            msgEl.className="alert-error"
            msgEl.textContent = errors.join("\n")
            return;
        }
        msgEl.className="alert-success"
        msgEl.textContent = "Валидные данные"
    })
</script>
</body>
</html>
